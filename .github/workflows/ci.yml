name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --reporter=dot

      - name: Build production bundle
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run backend tests
        env:
          ENVIRONMENT: test
        run: python -m pytest -q

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate production Compose file
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
          FRONTEND_URL: https://example.com
          RDS_HOST: db.example.com
          RDS_PORT: "5432"
          RDS_DB_NAME: careerpilot
          RDS_USERNAME: careerpilot
          RDS_PASSWORD: ci-only-placeholder
          RDS_SSLMODE: require
          REDIS_PASSWORD: ci-only-placeholder
          S3_BUCKET: careerpilot
          S3_ENDPOINT_URL: https://s3.example.com
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: ci-only-placeholder
          S3_SECRET_ACCESS_KEY: ci-only-placeholder
          LITELLM_BASE_URL: https://api.openai.com/v1
          LITELLM_API_KEY: ci-only-placeholder
          LITELLM_MODEL: ci-only-placeholder
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: careerpilot/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: careerpilot/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
