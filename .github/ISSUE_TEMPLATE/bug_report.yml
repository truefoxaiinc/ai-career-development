name: Bug report
description: Report a reproducible problem in CareerPilot
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Please remove secrets, access tokens, and personal data before submitting.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Go to ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit SHA, release, or deployment environment
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, deployment type, and other relevant details.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Drag files here. Remove credentials and personal data first.
