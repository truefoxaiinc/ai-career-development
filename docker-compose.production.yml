x-app-defaults: &app-defaults
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  RDS_HOST: ${RDS_HOST:?Set RDS_HOST to the RDS endpoint}
  RDS_PORT: ${RDS_PORT:-5432}
  RDS_DB_NAME: ${RDS_DB_NAME:?Set RDS_DB_NAME}
  RDS_USERNAME: ${RDS_USERNAME:?Set RDS_USERNAME}
  RDS_PASSWORD: ${RDS_PASSWORD:?Set RDS_PASSWORD}
  RDS_SSLMODE: ${RDS_SSLMODE:-require}
  VALKEY_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
  S3_REGION: ${S3_REGION:?Set S3_REGION}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
  S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
  LITELLM_BASE_URL: ${LITELLM_BASE_URL:?Set LITELLM_BASE_URL}
  LITELLM_API_KEY: ${LITELLM_API_KEY:?Set LITELLM_API_KEY}
  LITELLM_MODEL: ${LITELLM_MODEL:?Set LITELLM_MODEL}
  TASK_MODE: database
  ENABLE_DEV_JOB_PROVIDER: "false"

services:
  frontend:
    <<: *app-defaults
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge

  api:
    <<: *app-defaults
    build:
      context: ./backend
      target: api
    env_file:
      - path: .env.production
        required: false
    environment:
      <<: *backend-environment
      CORS_ORIGINS: '["${FRONTEND_URL:?Set FRONTEND_URL}"]'
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edge
      - data

  worker:
    <<: *app-defaults
    build:
      context: ./backend
      target: api
    env_file:
      - path: .env.production
        required: false
    environment:
      <<: *backend-environment
    command: ["python", "-m", "app.worker"]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - data
      - outbound

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - data

volumes:
  redis-data:

networks:
  edge:
  outbound:
  data:
    internal: true
